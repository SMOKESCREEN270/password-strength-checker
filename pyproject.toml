[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pwstrength"
dynamic = ["version"]
description = "Password strength checker: entropy estimation, policy compliance, dictionary/breach checks and actionable feedback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["password", "entropy", "security", "strength", "policy", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []  # zero runtime dependencies (stdlib only)

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "coverage>=7.5", "build>=1.2"]

[project.scripts]
pwstrength = "pwstrength.cli:run"

[tool.setuptools.dynamic]
version = { attr = "pwstrength.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pwstrength = ["data/*.txt", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.coverage.run]
source = ["pwstrength"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
